<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Seguridad: solo este sitio, las miniaturas de YouTube y el motor local
       de SongVerse (127.0.0.1). Sin scripts ni estilos incrustados. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://i.ytimg.com; connect-src 'self' http://127.0.0.1:47321; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>SongVerse · Canciones con portada y letra, y vídeos</title>
  <meta name="description" content="SongVerse baja canciones en la mejor calidad, con su portada, su letra sincronizada y sus datos, desde tus playlists de Spotify (CSV) o una búsqueda, y vídeos de YouTube. Todo en tu equipo, con su motor local." />
  <meta name="theme-color" content="#efe6d3" />
  <meta name="color-scheme" content="light" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="stylesheet" href="songverse.css" />
  <script src="app.js" defer></script>
</head>
<body class="dl">
  <a class="skip" href="#contenido">Saltar al contenido</a>

  <header class="nav" id="nav">
    <div class="container nav-inner">
      <a class="brand" href="./" aria-label="SongVerse, inicio">
        <img src="assets/logo.png" alt="" width="32" height="32" />
        <span>SONGVERSE</span>
        <span class="brand-sub">Descargas</span>
      </a>
      <div class="nav-actions">
        <span class="engine-pill" id="engine-pill" title="Buscando el motor…"><span class="dot"></span><span id="engine-pill-text">Buscando…</span></span>
        <a class="btn small" id="engine-btn" href="https://github.com/sebas-eze04/songverse-motor/releases/latest/download/SongVerse-Setup.exe">Descargar motor</a>
      </div>
    </div>
  </header>

  <main id="contenido" class="container dl-main">

    <section class="panel dl-engine" id="engine" aria-live="polite">
      <p class="muted">Buscando el motor…</p>
    </section>

    <section class="panel dl-video">
      <form id="video-form" class="row-form">
        <input id="video-url" class="field" type="url" placeholder="Pega la URL de un vídeo de YouTube" autocomplete="off" />
        <button class="btn" type="submit">Ver opciones</button>
      </form>
      <div id="video-info"></div>
    </section>

    <section class="panel dl-work">
      <p class="muted">Exporta tu biblioteca de Spotify en <b>exportify.net</b> y suelta aquí los archivos CSV.</p>
      <label class="drop" id="csv-drop">
        <input id="csv-input" type="file" accept=".csv,text/csv" multiple />
        <b>Elige o suelta tus CSV</b>
        <small>Puedes elegir varios a la vez</small>
      </label>
      <div id="csv-plan"></div>
    </section>

    <section class="panel dl-jobs" id="jobs-panel" hidden>
      <div class="jobs-head">
        <h2>En tu equipo</h2>
        <button class="link" type="button" id="jobs-clear">Quitar las terminadas</button>
      </div>
      <ul id="jobs"></ul>
    </section>

  </main>
</body>
</html>
